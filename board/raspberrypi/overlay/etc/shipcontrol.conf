{
    "gpio_engines": [
    {
        "syspwm_path": "/sys/class/pwm/pwmchip0",
        "syspwm_num": 0,
        "pwm_period": 16600,
        "min_duty_cycle": 6,
        "max_duty_cycle": 12,
        "rev_mode": "no_reverse"
    }
    ],
    "gpio_steering": [
    {
        "syspwm_path": "/sys/class/pwm/pwmchip0",
        "syspwm_num": 1,
        "pwm_period": 16600,
        "min_duty_cycle": 7,
        "max_duty_cycle": 11
    }
    ],
    "water_cooling_relay": {
        "chip_path": "/dev/gpiochip0",
        "line": 17
    },
    "keymap": {
        "BTN_LEFT": "SPEED_UP",
        "BTN_RIGHT": "SPEED_DOWN"
    },
    "relmap": {
        "REL_X+": "TURN_RIGHT",
        "REL_X-": "TURN_LEFT"
    },
    "unix_socket" : "/tmp/scsocket",
    "logbackends": ["syslog"],
    "loglevel": "debug"
}
